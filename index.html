<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>

        <form id="todo-form" class="todo-form">
            <label for="todo-input" class="visually-hidden">New task</label>
            <input
                id="todo-input"
                type="text"
                placeholder="Enter a new task"
                autocomplete="off"
                required
            >
            <button type="submit">Add</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-message" class="empty-message">No tasks yet.</p>
    </main>

    <script>
        const form = document.querySelector("#todo-form");
        const input = document.querySelector("#todo-input");
        const list = document.querySelector("#todo-list");
        const emptyMessage = document.querySelector("#empty-message");

        let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];

        function saveTasks() {
            localStorage.setItem("todoTasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            list.replaceChildren();

            tasks.forEach((task, index) => {
                const item = document.createElement("li");
                item.className = task.completed ? "todo-item completed" : "todo-item";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute("aria-label", `Mark ${task.text} as ${task.completed ? "incomplete" : "complete"}`);
                checkbox.addEventListener("change", () => {
                    tasks[index].completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const text = document.createElement("span");
                text.className = "todo-text";
                text.textContent = task.text;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
                deleteButton.addEventListener("click", () => {
                    tasks.splice(index, 1);
                    saveTasks();
                    renderTasks();
                });

                item.append(checkbox, text, deleteButton);
                list.append(item);
            });

            emptyMessage.hidden = tasks.length !== 0;
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const text = input.value.trim();
            if (!text) return;

            tasks.push({ text, completed: false });
            saveTasks();
            input.value = "";
            input.focus();
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
